server:
  port: 8086
  servlet:
    context-path: /pi

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gestion_ecole_anglaise?createDatabaseIfNotExist=true
    username: root
    password: ""
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

planning:
  service:
    url: http://localhost:8087/pi
