spring.application.name=gestion-groups-service
spring.config.import=optional:configserver:http://localhost:8888

server.port=8086
server.servlet.context-path=/pi

spring.datasource.url=jdbc:mysql://localhost:3306/gestion_ecole_anglaise?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

planning.service.url=http://localhost:8087/pi