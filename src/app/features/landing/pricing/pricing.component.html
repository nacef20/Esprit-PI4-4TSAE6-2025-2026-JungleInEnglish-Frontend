<div class="bg-gradient-to-b from-gray-100 to-white w-full py-14" id="pricing">
  <div class="max-w-screen-xl px-6 sm:px-8 lg:px-16 mx-auto flex flex-col w-full text-center">
    <div class="flex flex-col w-full">
      <app-scroll-animation>
        <h3 class="text-2xl sm:text-3xl lg:text-4xl font-medium text-gray-800 leading-relaxed">
          Choose Your Plan
        </h3>
        <p class="leading-normal w-10/12 sm:w-7/12 lg:w-6/12 mx-auto my-2 text-gray-600">
          Let's choose the package that is best for you and explore it happily
          and cheerfully.
        </p>
      </app-scroll-animation>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 py-8">
        <app-scroll-animation *ngFor="let plan of plans" className="flex justify-center">
          <div
            class="flex flex-col justify-center items-center border-2 border-gray-200 rounded-xl py-6 px-8 hover:scale-105 transition duration-200 bg-white"
          >
            <div class="mt-6">
              <img [src]="plan.image" [alt]="plan.name" class="w-32 h-32 object-contain rounded-lg" />
            </div>
            <p class="text-lg text-gray-800 font-medium capitalize my-6">
              {{ plan.name }}
            </p>
            <ul class="flex flex-col list-inside items-start text-left text-gray-600 flex-grow">
              <li *ngFor="let feature of plan.features" class="my-2">✔ {{ feature }}</li>
            </ul>
            <div class="flex flex-col w-full justify-center mt-10">
              <p class="text-2xl text-gray-800 text-center mb-4 font-semibold">
                {{ plan.price }}
              </p>
              <button
                class="border border-school-primary text-school-primary px-6 py-2 rounded-full hover:bg-school-primary hover:text-white transition"
              >
                Select
              </button>
            </div>
          </div>
        </app-scroll-animation>
      </div>
    </div>
  </div>
</div>
