<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-800">Gestion des Quiz</h1>
    <button (click)="addQuiz()"
      class="flex items-center gap-2 px-4 py-2 bg-[#0ea37a] text-white rounded-lg hover:bg-[#0b8a68] transition-all">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nouveau Quiz
    </button>
  </div>

  <!-- Empty state -->
  <div *ngIf="quizzes.length === 0" class="text-center py-16 text-gray-400">
    <svg class="mx-auto mb-4" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9 12h6m-3-3v6m-7 4h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    </svg>
    <p class="text-lg">Aucun quiz pour le moment</p>
  </div>

  <!-- Cards grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let quiz of quizzes"
      class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition-shadow">

      <!-- Status badge -->
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full"
          [ngClass]="{
            'bg-yellow-100 text-yellow-700': quiz.status === 'DRAFT',
            'bg-green-100 text-green-700': quiz.status === 'PUBLISHED',
            'bg-red-100 text-red-700': quiz.status === 'CLOSED'
          }">
          {{ quiz.status }}
        </span>
        <span class="text-xs text-gray-400">{{ quiz.duration }} min</span>
      </div>

      <!-- Title & description -->
      <h3 class="text-lg font-semibold text-gray-800 mb-1">{{ quiz.title }}</h3>
      <p class="text-sm text-gray-500 mb-4 line-clamp-2">{{ quiz.description }}</p>

      <!-- Actions -->
      <div class="flex items-center gap-2 pt-3 border-t border-gray-100">
        <button (click)="manageQuestions(quiz.id!)"
          class="flex-1 text-center text-sm px-3 py-2 bg-[#0ea37a]/10 text-[#0ea37a] rounded-lg hover:bg-[#0ea37a]/20 transition-all font-medium">
          Questions
        </button>
        <button (click)="editQuiz(quiz.id!)"
          class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-all" title="Modifier">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
        <button (click)="deleteQuiz(quiz.id!)"
          class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-all" title="Supprimer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div *ngIf="totalPages > 1" class="flex items-center justify-between bg-white rounded-xl shadow-sm border border-gray-100 px-6 py-4">
    <span class="text-sm text-gray-500">
      Page {{ currentPage }} sur {{ totalPages }} — {{ totalElements }} quiz
    </span>
    <div class="flex items-center gap-1">
      <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1"
        class="px-3 py-1.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 transition-all disabled:opacity-40 disabled:cursor-not-allowed">
        ← Précédent
      </button>
      <ng-container *ngFor="let page of getPageNumbers()">
        <button (click)="goToPage(page)"
          class="w-9 h-9 text-sm rounded-lg border transition-all"
          [ngClass]="page === currentPage ? 'bg-[#0ea37a] text-white border-[#0ea37a]' : 'border-gray-200 hover:bg-gray-50'">
          {{ page }}
        </button>
      </ng-container>
      <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages"
        class="px-3 py-1.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 transition-all disabled:opacity-40 disabled:cursor-not-allowed">
        Suivant →
      </button>
    </div>
  </div>
</div>
