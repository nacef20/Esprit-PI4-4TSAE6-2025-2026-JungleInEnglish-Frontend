<aside class="sidebar" [class.collapsed]="isCollapsed">
  <!-- Toggle Button at Top -->
  <div class="sidebar__header">
    <button class="sidebar__toggle" (click)="toggleSidebar()" [attr.aria-label]="isCollapsed ? 'Open menu' : 'Close menu'">
      <span class="material-symbols-outlined" style="font-size:32px;color:hsla(162, 72%, 65%, 1.00)">menu</span>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar__nav">
    <ul class="nav-list">
      <!-- Dashboard -->
      <li class="nav-item">
        <a 
          class="nav-link" 
          [class.active]="currentRoute === '/dashboard'"
          [routerLink]="['/dashboard']"
          routerLinkActive="active"
        >
          <div class="nav-link__icon">
            <span class="material-symbols-outlined">dashboard</span>
          </div>
          <span class="nav-link__text">Dashboard</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>

      <!-- Divider -->
      <li class="nav-divider">
        <span class="nav-divider__text">Communication</span>
      </li>

      <!-- Chat Group -->
     <li class="nav-item">
  <a 
    class="nav-link" 
    [routerLink]="['gestionchatprive']"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <div class="nav-link__icon">
      <span class="material-symbols-outlined">chat</span>
    </div>
    <span class="nav-link__text">Chat Privé</span>
    <div class="nav-link__indicator"></div>
  </a>
</li>

      <!-- Divider -->
      <li class="nav-divider">
        <span class="nav-divider__text">Quiz</span>
      </li>

      <!-- Quiz Management -->
      <li class="nav-item">
        <a
          class="nav-link"
          [routerLink]="['quizzes']"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <div class="nav-link__icon">
            <span class="material-symbols-outlined">quiz</span>
          </div>
          <span class="nav-link__text">Quiz</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>

      <!-- AI Quiz Generator -->
      <li class="nav-item">
        <a
          class="nav-link"
          [routerLink]="['quizzes/ai-generate']"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <div class="nav-link__icon">
            <span class="material-symbols-outlined">auto_awesome</span>
          </div>
          <span class="nav-link__text">AI Generator</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>

      <!-- Attempts History -->
      <li class="nav-item">
        <a
          class="nav-link"
          [routerLink]="['attempts']"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <div class="nav-link__icon">
            <span class="material-symbols-outlined">history</span>
          </div>
          <span class="nav-link__text">Attempts</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>


      <!-- Forum -->
      <li class="nav-item">
        <a 
          class="nav-link" 
          [class.active]="currentRoute === '/forum'"
          [routerLink]="['/forum']"
          routerLinkActive="active"
        >
          <div class="nav-link__icon">
            <span class="material-symbols-outlined">forum</span>
          </div>
          <span class="nav-link__text">Forum</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer Section (Optional) -->
  <div class="sidebar__footer">
    <div class="footer-info">
      <div class="footer-info__icon">
        <span class="material-symbols-outlined" style="font-size:20px">info</span>
      </div>
      <span class="footer-info__text">Help Center</span>
    </div>
  </div>
</aside>
