<div class="modal-overlay" (click)="fermerModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">

    <!-- Modal Header -->
    <div class="modal-header">
      <h2>
        <span class="bar"></span>
        Join Group Requests
      </h2>
      <button class="btn-close" type="button" (click)="fermerModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <!-- Requests Table -->
      <table *ngIf="demandes.length > 0; else noRequests" class="table-demandes">
        <thead>
          <tr>
            <th>Request ID</th>
            <th>User</th>
            <th>Request Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let demande of demandes">
            <td>{{ demande.idJoinGroup }}</td>
            <td>{{ demande.userId }}</td>
            
            <td>{{ demande.requestedAt || '-' }}</td>
            <td>{{ demande.status || 'PENDING' }}</td>
            <td class="table-actions">
              <button class="btn-accept" (click)="accepterDemande(demande)" [disabled]="demande.status === 'ACCEPTE'">Accept</button>
              <button class="btn-reject" (click)="refuserDemande(demande)" [disabled]="demande.status === 'REFUSE' || demande.status === 'ACCEPTE'">Reject</button>

     

              
              
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Message if no requests -->
      <ng-template #noRequests>
        <p>No requests at the moment.</p>
      </ng-template>
    </div>

  </div>
</div>
