<header class="site-header"
  class="fixed top-0 left-0 right-0 w-full z-30 bg-white/95 backdrop-blur border-b border-gray-100 transition-all"
  [ngClass]="{'shadow-sm': scrollActive}"
>
  <nav class="max-w-screen-xl mx-auto px-6 sm:px-8 lg:px-16 h-16 flex items-center justify-between">

    <!-- LOGO + TITLE -->
    <div class="flex items-center gap-3 min-w-[220px]">
      <img src="assets/logo.jpg" class="h-9 w-9 object-contain" alt="Logo" />
      <h1 class="text-base font-extrabold tracking-tight text-gray-900 leading-none">
        Jungle in English
      </h1>
    </div>

    <!-- MENU -->
    <ul class="hidden lg:flex items-center gap-8 font-semibold text-gray-700">
      <li
        (click)="scrollTo('about')"
        [ngClass]="activeLink === 'about' ? 'menu-active' : ''"
        class="menu-link"
      >
        About
      </li>

      <li
        (click)="scrollTo('feature')"
        [ngClass]="activeLink === 'feature' ? 'menu-active' : ''"
        class="menu-link"
      >
        Feature
      </li>

      <li
        (click)="scrollTo('pricing')"
        [ngClass]="activeLink === 'pricing' ? 'menu-active' : ''"
        class="menu-link"
      >
        Pricing
      </li>

      <li
        (click)="scrollTo('testimonials')"
        [ngClass]="activeLink === 'testimonials' ? 'menu-active' : ''"
        class="menu-link"
      >
        Testimonials
      </li>
    </ul>
    
<a routerLink="/courses" class="courses-link">Courses</a>
<a routerLink="/my-complaints" class="courses-link">Reclamations</a>

    <!-- ACTIONS -->
    <div class="flex items-center justify-end min-w-[160px]">
      <a (click)="login()" class="signin-link">
        Sign In
      </a>
    </div>

  </nav>
</header>
