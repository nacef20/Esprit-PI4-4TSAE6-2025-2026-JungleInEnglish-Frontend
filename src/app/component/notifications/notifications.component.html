<app-navbar></app-navbar>

<div class="notifications-container px-4 mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="fas fa-bell me-3 text-success"></i>All Notifications
        </h2>
        <div class="d-flex gap-2">
            <button class="jungle-btn jungle-btn-secondary py-2" (click)="refresh()">
                <i class="fas fa-sync-alt" [class.fa-spin]="loading"></i>
            </button>
        </div>
    </div>

    <div class="notification-list-card shadow-sm">
        <div *ngIf="loading && !notifications.length" class="empty-state">
            <div class="spinner-border text-success mb-3" role="status"></div>
            <p>Loading your alerts...</p>
        </div>

        <div *ngIf="!loading && notifications.length === 0" class="empty-state">
            <div class="empty-icon"><i class="fas fa-bell-slash"></i></div>
            <h4 class="fw-bold">No notifications yet</h4>
            <p class="text-secondary">When candidates apply to your jobs, you'll see them here.</p>
        </div>

        <div *ngFor="let n of notifications" class="notification-row" [class.unread]="!n.read"
            (click)="onNotificationClick(n)">
            <div class="notification-icon">
                <i class="fas fa-user-tie"></i>
            </div>
            <div class="notification-content">
                <div class="notification-title">
                    {{ n.candidateFullName }} <span class="fw-normal text-secondary mx-1">applied to</span> {{
                    n.jobOfferTitle }}
                </div>
                <div class="notification-meta">
                    <span class="match-badge">
                        <i class="fas fa-chart-pie me-1"></i> {{ n.matchingScore | number:'1.0-1' }}% Match
                    </span>
                    <span><i class="far fa-clock me-1"></i> {{ n.applicationDate | date:'medium' }}</span>
                    <span *ngIf="!n.read" class="badge bg-success rounded-pill small">New</span>
                </div>
            </div>
            <div class="notification-actions">
                <button *ngIf="!n.read" class="btn-mark-read" (click)="markAsRead($event, n)">
                    Mark as read
                </button>
            </div>
        </div>
    </div>
</div>
