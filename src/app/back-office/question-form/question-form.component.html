<div class="max-w-2xl mx-auto space-y-6">
  <!-- Header -->
  <div class="flex items-center gap-3">
    <button (click)="cancel()" class="p-2 hover:bg-gray-100 rounded-lg transition-all">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <h1 class="text-2xl font-bold text-gray-800">{{ isEdit ? 'Modifier la Question' : 'Nouvelle Question' }}</h1>
  </div>

  <!-- Form card -->
  <form [formGroup]="questionForm" (ngSubmit)="onSubmit()" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 space-y-5">

    <!-- Content -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Contenu de la question</label>
      <textarea formControlName="content" rows="3" placeholder="Tapez votre question ici..."
        class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0ea37a]/30 focus:border-[#0ea37a] outline-none transition-all resize-none"></textarea>
    </div>

    <!-- Points -->
    <div class="max-w-xs">
      <label class="block text-sm font-medium text-gray-700 mb-1">Points</label>
      <input formControlName="points" type="number" min="1"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0ea37a]/30 focus:border-[#0ea37a] outline-none transition-all" />
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
      <button type="submit" [disabled]="questionForm.invalid"
        class="px-6 py-2.5 bg-[#0ea37a] text-white rounded-lg hover:bg-[#0b8a68] transition-all disabled:opacity-50 disabled:cursor-not-allowed font-medium">
        {{ isEdit ? 'Enregistrer' : 'Créer' }}
      </button>
      <button type="button" (click)="cancel()"
        class="px-6 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-all font-medium">
        Annuler
      </button>
    </div>
  </form>
</div>
