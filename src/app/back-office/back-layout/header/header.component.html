<header class="top-bar">
  <div class="top-bar__container">
    <!-- Left Section: Logo & Brand -->
    <div class="top-bar__left">
      <div class="brand">
        <img src="assets/logo.jpg" alt="Logo" class="brand__logo" />
        <span class="brand__name" style="color: #0ea37a;">jungle in english</span>
      </div>
    </div>

    <!-- Center Section: Search (optional) -->
    <div class="top-bar__center">
      <div class="search-box">
        <span class="material-symbols-outlined search-box__icon" style="font-size:20px">search</span>
        <input 
          type="text" 
          class="search-box__input" 
          placeholder="Search..."
          [(ngModel)]="searchQuery"
        />
      </div>
    </div>

    <!-- Right Section: Actions -->
    <div class="top-bar__right">
      <!-- Notifications -->
      <button class="action-btn" [class.has-badge]="notificationCount > 0" (click)="toggleNotifications()">
        <span class="material-symbols-outlined action-btn__icon" style="font-size:20px">notifications</span>
       
      </button>

      <!-- Dark Mode Toggle -->
      <button class="action-btn" (click)="toggleDarkMode()">
        <span *ngIf="!isDarkMode" class="material-symbols-outlined action-btn__icon" style="font-size:20px">dark_mode</span>
        <span *ngIf="isDarkMode" class="material-symbols-outlined action-btn__icon" style="font-size:20px">light_mode</span>
      </button>

      <!-- User Menu -->
      <div class="user-menu" [class.is-open]="isUserMenuOpen">
        <button class="user-menu__trigger" (click)="toggleUserMenu()">
        <img 
  class="user-menu__avatar" 
  [src]="userAvatar || 'assets/utilisateur.png'" 
  [alt]="userName"
  (error)="userAvatar = 'assets/utilisateur.png'"
/>
          <div class="user-menu__info">
            <span class="user-menu__name">{{ userName }}</span>
            <span class="user-menu__role">{{ userRole }}</span>
          </div>
          <span class="material-symbols-outlined user-menu__chevron" style="font-size:16px">expand_more</span>
        </button>

        <!-- Dropdown Menu -->
        <div class="user-menu__dropdown" *ngIf="isUserMenuOpen">
          <a class="dropdown-item" (click)="navigateTo('profile')">
            <span class="material-symbols-outlined" style="font-size:16px">person</span>
            <span>Profile</span>
          </a>
          <a class="dropdown-item" (click)="navigateTo('settings')">
            <span class="material-symbols-outlined" style="font-size:16px">settings</span>
            <span>Settings</span>
          </a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item dropdown-item--danger" (click)="logout()">
            <span class="material-symbols-outlined" style="font-size:16px">logout</span>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
