


spring:
  cloud:
    config:
      fail-fast: true
      import-check:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  datasource:
    url: jdbc:mysql://localhost:3306/reclamationreponse?createDatabaseIfNotExist=true
    username: root
    password: ""

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true

