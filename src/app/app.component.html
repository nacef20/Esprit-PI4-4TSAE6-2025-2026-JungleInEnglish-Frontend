<nav class="nav">
  <a routerLink="/products" class="nav__brand">🌿 Jungle</a>
  <a routerLink="/products" routerLinkActive="nav__link--active" [routerLinkActiveOptions]="{ exact: true }"
    class="nav__link">Produits</a>
  <a routerLink="/categories" routerLinkActive="nav__link--active" class="nav__link">📂 Catégories</a>

  @if (auth.isLoggedIn()) {
  <a routerLink="/cart" routerLinkActive="nav__link--active" class="nav__link">🛒 Panier</a>
  <a routerLink="/my-orders" routerLinkActive="nav__link--active" class="nav__link">Commandes</a>
  <a routerLink="/products/create" routerLinkActive="nav__link--active" class="nav__link">+ Nouveau Produit</a>

  @if (auth.isAdmin()) {
  <a routerLink="/admin" routerLinkActive="nav__link--active" class="nav__link nav__link--admin">⚙ Admin</a>
  }

  <span class="nav__spacer"></span>
  <span class="nav__user">{{ auth.currentUser()?.name ?? auth.currentUser()?.email }}</span>
  <button type="button" class="nav__link nav__btn" (click)="auth.logout()">Déconnexion</button>
  } @else {
  <span class="nav__spacer"></span>
  <a routerLink="/login" routerLinkActive="nav__link--active" class="nav__link">Connexion</a>
  <a routerLink="/signup" routerLinkActive="nav__link--active" class="nav__link nav__link--cta">Inscription</a>
  }
</nav>
<main class="main">
  <router-outlet />
</main>
<app-message-toast />
