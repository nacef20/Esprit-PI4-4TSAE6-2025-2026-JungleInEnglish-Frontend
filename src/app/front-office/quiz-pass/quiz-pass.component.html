<div class="min-h-screen bg-gradient-to-br from-gray-50 to-white pt-24 pb-16 px-6">
  <div class="max-w-3xl mx-auto">

    <!-- Score result -->
    <div *ngIf="submitted" class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 text-center mb-8">
      <div class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center"
        [ngClass]="score >= totalPoints / 2 ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-500'">
        <svg *ngIf="score >= totalPoints / 2" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <svg *ngIf="score < totalPoints / 2" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-1">Quiz terminé !</h2>
      <p class="text-lg text-gray-600">
        Score : <span class="font-bold text-[#0ea37a]">{{ score }}</span> / {{ totalPoints }}
      </p>
      <button (click)="goBack()"
        class="mt-6 px-6 py-2.5 bg-[#0ea37a] text-white rounded-lg hover:bg-[#0b8a68] transition-all font-medium">
        Retour aux quiz
      </button>
    </div>

    <!-- Quiz header -->
    <div *ngIf="quiz" class="mb-8">
      <button (click)="goBack()" class="flex items-center gap-2 text-gray-500 hover:text-gray-700 mb-4 transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Retour
      </button>
      <h1 class="text-2xl font-bold text-gray-800 mb-1">{{ quiz.title }}</h1>
      <p class="text-gray-500">{{ quiz.description }}</p>
      <div class="flex items-center gap-4 mt-3 text-sm text-gray-400">
        <span class="flex items-center gap-1">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          {{ quiz.duration }} min
        </span>
        <span>{{ questions.length }} questions</span>
        <span>{{ totalPoints }} points</span>
      </div>
    </div>

    <!-- Questions -->
    <div class="space-y-6">
      <div *ngFor="let question of questions; let i = index"
        class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">

        <div class="flex items-center gap-2 mb-3">
          <span class="text-sm font-bold text-[#0ea37a] bg-[#0ea37a]/10 px-2.5 py-1 rounded-full">Q{{ i + 1 }}</span>
          <span class="text-xs text-gray-400">{{ question.points }} pts</span>
        </div>

        <p class="text-gray-800 font-medium mb-4">{{ question.content }}</p>

        <!-- Choices -->
        <div class="space-y-2">
          <button *ngFor="let choice of choicesByQuestion.get(question.id!)"
            (click)="!submitted && selectChoice(question.id!, choice.id!)"
            [disabled]="submitted"
            class="w-full text-left px-4 py-3 rounded-lg border-2 transition-all flex items-center gap-3"
            [ngClass]="{
              'border-[#0ea37a] bg-[#0ea37a]/5': isSelected(question.id!, choice.id!) && !submitted,
              'border-gray-200 hover:border-gray-300': !isSelected(question.id!, choice.id!) && !submitted,
              'border-green-500 bg-green-50': submitted && isCorrectChoice(question.id!, choice.id!),
              'border-red-400 bg-red-50': submitted && isSelected(question.id!, choice.id!) && !isCorrectChoice(question.id!, choice.id!),
              'border-gray-100 opacity-60': submitted && !isSelected(question.id!, choice.id!) && !isCorrectChoice(question.id!, choice.id!)
            }">

            <!-- Radio circle -->
            <span class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0"
              [ngClass]="{
                'border-[#0ea37a]': isSelected(question.id!, choice.id!) && !submitted,
                'border-gray-300': !isSelected(question.id!, choice.id!) && !submitted,
                'border-green-500': submitted && isCorrectChoice(question.id!, choice.id!),
                'border-red-400': submitted && isSelected(question.id!, choice.id!) && !isCorrectChoice(question.id!, choice.id!)
              }">
              <span *ngIf="isSelected(question.id!, choice.id!)" class="w-2.5 h-2.5 rounded-full"
                [ngClass]="submitted ? (isCorrectChoice(question.id!, choice.id!) ? 'bg-green-500' : 'bg-red-400') : 'bg-[#0ea37a]'">
              </span>
            </span>

            <span class="text-gray-700">{{ choice.content }}</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Submit button -->
    <div *ngIf="!submitted && questions.length > 0" class="mt-8 text-center">
      <button (click)="submit()"
        class="px-8 py-3 bg-[#0ea37a] text-white rounded-lg font-medium hover:bg-[#0b8a68] transition-all shadow-md hover:shadow-lg text-lg">
        Soumettre le quiz
      </button>
    </div>
  </div>
</div>
