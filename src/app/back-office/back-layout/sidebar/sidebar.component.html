<aside class="sidebar" [class.collapsed]="isCollapsed">
  <!-- Toggle Button at Top -->
  <div class="sidebar__header">
    <button class="sidebar__toggle" (click)="toggleSidebar()" [attr.aria-label]="isCollapsed ? 'Ouvrir le menu' : 'Fermer le menu'">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 640 640">
        <path fill="hsla(162, 72%, 65%, 1.00)" d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z"/>
      </svg>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar__nav">
    <ul class="nav-list">
      <!-- Dashboard -->
      <li class="nav-item">
        <a 
          class="nav-link" 
          [class.active]="currentRoute === '/dashboard'"
          [routerLink]="['/dashboard']"
          routerLinkActive="active"
        >
          <div class="nav-link__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
          </div>
          <span class="nav-link__text">Dashboard</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>

      <!-- Divider -->
      <li class="nav-divider">
        <span class="nav-divider__text">Courses Management</span>
      </li>

        <!-- Courses Management -->
      <li class="nav-item">
        <a 
          class="nav-link" 
          [class.active]="currentRoute === '/admin/courses'"
          [routerLink]="['/admin/courses']"
          routerLinkActive="active"
        >
          <div class="nav-link__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
          </div>
          <span class="nav-link__text">Courses</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>

      <!-- Lessons Management -->
      <li class="nav-item">
        <a 
          class="nav-link" 
          [class.active]="currentRoute === '/admin/lessons'"
          [routerLink]="['/admin/lessons']"
          routerLinkActive="active"
        >
          <div class="nav-link__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <span class="nav-link__text">Lessons</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>

      <!-- Divider -->
      <li class="nav-divider">
        <span class="nav-divider__text">Communication</span>
      </li>

      <!-- Chat Group -->
      <li class="nav-item">
        <a 
          class="nav-link" 
          [class.active]="currentRoute === '/chat-group'"
          [routerLink]="['/chat-group']"
          routerLinkActive="active"
        >
          <div class="nav-link__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <span class="nav-link__text">Chat Group</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>

      <!-- Forum -->
      <li class="nav-item">
        <a 
          class="nav-link" 
          [class.active]="currentRoute === '/forum'"
          [routerLink]="['/forum']"
          routerLinkActive="active"
        >
          <div class="nav-link__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
          </div>
          <span class="nav-link__text">Forum</span>
          <div class="nav-link__indicator"></div>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer Section (Optional) -->
  <div class="sidebar__footer">
    <div class="footer-info">
      <div class="footer-info__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </div>
      <span class="footer-info__text">Centre d'aide</span>
    </div>
  </div>
</aside>
