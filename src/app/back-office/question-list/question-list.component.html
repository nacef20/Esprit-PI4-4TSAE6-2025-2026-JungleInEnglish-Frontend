<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button (click)="goBack()" class="p-2 hover:bg-gray-100 rounded-lg transition-all">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h1 class="text-2xl font-bold text-gray-800">Questions for Quiz #{{ quizId }}</h1>
    </div>
    <button (click)="addQuestion()"
      class="flex items-center gap-2 px-4 py-2 bg-[#0ea37a] text-white rounded-lg hover:bg-[#0b8a68] transition-all">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Question
    </button>
  </div>

  <!-- Empty state -->
  <div *ngIf="questions.length === 0" class="text-center py-16 text-gray-400">
    <p class="text-lg">No questions for this quiz</p>
  </div>

  <!-- Questions list -->
  <div class="space-y-4">
    <div *ngFor="let question of questions; let i = index"
      class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition-shadow">
      <div class="flex items-start justify-between">
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-bold text-[#0ea37a] bg-[#0ea37a]/10 px-2 py-0.5 rounded-full">Q{{ i + 1 }}</span>
            <span class="text-xs text-gray-400">{{ question.points }} pts</span>
          </div>
          <p class="text-gray-800 font-medium">{{ question.content }}</p>
        </div>
        <div class="flex items-center gap-1 ml-4">
          <button (click)="manageChoices(question.id!)"
            class="text-sm px-3 py-1.5 bg-[#0ea37a]/10 text-[#0ea37a] rounded-lg hover:bg-[#0ea37a]/20 transition-all font-medium">
            Choices
          </button>
          <button (click)="editQuestion(question.id!)"
            class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button (click)="deleteQuestion(question.id!)"
            class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
