<div class="relative max-w-screen-xl mt-24 px-6 sm:px-8 lg:px-16 mx-auto" id="about">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 py-12 lg:py-20 items-center">
    <div class="flex flex-col justify-center items-start animate-fade-in">
      <div class="inline-block mb-6">
        <span
          class="px-4 py-2 bg-school-accent/10 text-school-primary rounded-full text-sm font-semibold border border-school-accent/20 backdrop-blur-sm"
        >
          Your Learning Academy
        </span>
      </div>
      <h1 class="text-4xl lg:text-5xl xl:text-6xl font-bold text-school-primary leading-tight mb-4">
        Your Future Speaks
        <span class="relative inline-block mt-2">
          <span
            class="relative z-10 bg-gradient-to-r from-school-primary via-school-accent to-school-accent-alt bg-clip-text text-transparent"
          >
            English
          </span>
          <span
            class="absolute bottom-2 left-0 w-full h-4 bg-school-accent/30 -z-10 rounded"
          ></span>
        </span>
      </h1>
      <p class="text-2xl lg:text-3xl font-semibold text-school-accent-alt mb-6">
        Step in and Let's Start Your Journey
      </p>
      <div
        class="w-20 h-1 bg-gradient-to-r from-school-primary to-school-accent rounded-full mb-6"
      ></div>
      <div
        class="bg-school-secondary/50 border-l-4 border-school-primary rounded-lg p-6 mb-8 backdrop-blur-sm"
      >
        <h2
          class="text-xl lg:text-2xl font-bold text-school-primary mb-3 flex items-center gap-2"
        >
          <span class="text-2xl">🌟</span>
          What is Piang?
        </h2>
        <p class="text-base lg:text-lg text-gray-700 leading-relaxed">
          <strong class="text-school-primary">Piang</strong> is the academy you
          need to improve your skills and get rid of the difficulties you have
          always had.
        </p>
      </div>
      <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto mb-8">
        <button
          (click)="onGetStarted()"
          class="px-8 py-4 bg-school-primary text-white rounded-xl font-semibold hover:bg-school-primary-dark transition-all duration-300"
        >
          Get Started
        </button>
      </div>
    </div>
    <div class="relative flex items-center justify-center lg:justify-end animate-fade-in delay-200">
      <div
        class="absolute -top-10 -right-10 w-72 h-72 bg-school-accent/20 rounded-full filter blur-3xl animate-pulse-slow"
      ></div>
      <div
        class="absolute -bottom-10 -left-10 w-64 h-64 bg-school-primary/10 rounded-full filter blur-3xl animate-pulse-slow"
        style="animation-delay: 2s"
      ></div>
      <div class="relative z-10">
        <div class="relative overflow-hidden rounded-3xl shadow-2xl border-4 border-white/50">
          <img
            src="https://placehold.co/600x400/0ea37a/fff?text=Piang"
            alt="Learning Journey"
            class="w-full h-auto"
          />
          <div
            class="absolute inset-0 bg-gradient-to-tr from-school-primary/10 via-transparent to-school-accent/10 pointer-events-none"
          ></div>
        </div>
        <div
          class="absolute top-1/2 -left-8 lg:-left-12 -translate-y-1/2 badge-pro badge-green animate-float"
        >
          <div class="badge-row">
            <div class="badge-ico">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-4-4h-1m-4 6H2v-2a4 4 0 014-4h1m6 6v-2a4 4 0 00-4-4H8m8-4a4 4 0 11-8 0 4 4 0 018 0z" />
              </svg>
            </div>
            <div class="badge-text">
              <p class="badge-title">Students</p>
              <p class="badge-value">{{ studentCountDisplay }}+</p>
            </div>
          </div>
        </div>
        <div
          class="absolute top-1/4 -right-8 lg:-right-12 badge-pro badge-white hidden lg:block animate-float"
          style="animation-delay: 1.5s"
        >
          <div class="badge-row">
            <div class="badge-ico badge-ico-dark">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <div class="badge-text">
              <p class="badge-title">Success</p>
              <p class="badge-value">{{ successRateDisplay }}%</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
