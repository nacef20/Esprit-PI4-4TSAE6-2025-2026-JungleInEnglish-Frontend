spring.application.name=todomodule
spring.config.import=optional:configserver:http://localhost:8888

# Local Fallback Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/todomodule?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/jungleinenglish-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8085/realms/jungleinenglish-realm/protocol/openid-connect/certs
