<main class="relative overflow-hidden">
  <!-- Section Hero -->
  <section id="home" class="relative min-h-screen flex items-center overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-school-secondary via-white to-school-secondary-light"></div>
    <div class="absolute inset-0 parallax-layer-1">
      <div class="absolute top-20 left-10 w-[600px] h-[600px] bg-school-accent rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float"></div>
      <div class="absolute bottom-20 right-10 w-[500px] h-[500px] bg-school-primary rounded-full mix-blend-multiply filter blur-3xl opacity-15 animate-float" style="animation-delay: 1s"></div>
    </div>
    <div class="absolute inset-0 opacity-5 bg-[linear-gradient(to_right,#0ea37a_1px,transparent_1px),linear-gradient(to_bottom,#0ea37a_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>
    <div class="max-w-screen-xl px-6 sm:px-8 lg:px-16 mx-auto w-full relative z-10 parallax-layer-2">
      <app-home></app-home>
    </div>
    <div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-white/50 to-transparent"></div>
  </section>

  <!-- Wave Divider -->
  <div class="relative h-32">
    <svg class="absolute bottom-0 w-full h-32" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <defs>
        <linearGradient id="wave-gradient-1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#faf5f0;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
        </linearGradient>
      </defs>
      <path fill="url(#wave-gradient-1)" d="M0,64L48,69.3C96,75,192,85,288,80C384,75,480,53,576,48C672,43,768,53,864,58.7C960,64,1056,64,1152,58.7C1248,53,1344,43,1392,37.3L1440,32L1440,120L1392,120C1344,120,1248,120,1152,120C1056,120,960,120,864,120C768,120,672,120,576,120C480,120,384,120,288,120C192,120,96,120,48,120L0,120Z"></path>
    </svg>
  </div>

  <!-- Section Features -->
  <section id="feature" class="relative py-32 bg-white">
    <div class="absolute inset-0">
      <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-transparent via-school-secondary-light/10 to-transparent"></div>
    </div>
    <div class="absolute top-20 right-10 w-64 h-64 bg-school-accent/5 rounded-3xl transform rotate-12 blur-sm"></div>
    <div class="absolute bottom-20 left-10 w-80 h-80 bg-school-primary/5 rounded-3xl transform -rotate-6 blur-sm"></div>
    <div class="max-w-screen-xl px-6 sm:px-8 lg:px-16 mx-auto relative z-10">
      <app-feature></app-feature>
    </div>
  </section>

  <!-- Wave Divider inversé -->
  <div class="relative h-32">
    <svg class="absolute top-0 w-full h-32" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <defs>
        <linearGradient id="wave-gradient-2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#F7EDE2;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#faf5f0;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#F7EDE2;stop-opacity:1" />
        </linearGradient>
      </defs>
      <path fill="url(#wave-gradient-2)" d="M0,0L48,5.3C96,11,192,21,288,26.7C384,32,480,32,576,26.7C672,21,768,11,864,16C960,21,1056,43,1152,48C1248,53,1344,43,1392,37.3L1440,32L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path>
    </svg>
  </div>

  <!-- Section Pricing -->
  <section id="pricing" class="relative py-32 bg-school-secondary overflow-hidden">
    <div class="absolute inset-0">
      <div class="absolute top-0 left-1/4 w-96 h-96 bg-school-accent rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
      <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-school-primary rounded-full mix-blend-multiply filter blur-3xl opacity-15 animate-blob" style="animation-delay: 2s"></div>
      <div class="absolute bottom-0 left-1/2 w-96 h-96 bg-school-accent-alt rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob" style="animation-delay: 4s"></div>
    </div>
    <div class="max-w-screen-xl px-6 sm:px-8 lg:px-16 mx-auto relative z-10">
      <app-pricing></app-pricing>
    </div>
    <div class="absolute bottom-0 left-0 right-0 h-40 bg-gradient-to-t from-white/30 to-transparent"></div>
  </section>

  <!-- Section Testimonials -->
  <section id="testimonials" class="relative py-32 bg-gradient-to-b from-white via-school-secondary-light/30 to-white overflow-hidden">
    <div class="absolute inset-0 pointer-events-none">
      <div class="absolute top-10 left-0 w-72 h-72 bg-school-accent rounded-full mix-blend-multiply filter blur-3xl opacity-10 transform -translate-x-1/2 scale-75"></div>
      <div class="absolute bottom-10 right-0 w-96 h-96 bg-school-primary rounded-full mix-blend-multiply filter blur-3xl opacity-10 transform translate-x-1/2 scale-90"></div>
    </div>
    <div class="max-w-screen-xl px-6 sm:px-8 lg:px-16 mx-auto relative z-10">
      <app-testimonial></app-testimonial>
    </div>
  </section>
</main>
