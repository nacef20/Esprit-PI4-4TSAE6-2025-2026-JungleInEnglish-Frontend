server:
  port: 8086

spring:
  application:
    name: todomodule
  datasource:
    url: jdbc:mysql://localhost:3306/todomodule?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: brrn99amine@gmail.com
    password: rgpqqabzpzjihexy
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Keycloak Integration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/jungleinenglish-realm
          jwk-set-uri: http://localhost:8085/realms/jungleinenglish-realm/protocol/openid-connect/certs

# Custom Keycloak Admin Config for Sync
keycloak:
  auth-server-url: http://localhost:8085
  realm: jungleinenglish-realm
  admin:
    username: admin
    password: 111
    client-id: admin-cli

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Swagger UI / OpenAPI
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# Logging
logging:
  level:
    org.springframework.security: DEBUG
    tn.esprit.todomodule.security: DEBUG
    tn.esprit.todomodule.security.jwt: DEBUG
