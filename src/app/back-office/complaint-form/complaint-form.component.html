<div class="max-w-2xl mx-auto space-y-6">
  <!-- Header -->
  <div class="flex items-center gap-3">
    <button (click)="cancel()" class="p-2 hover:bg-gray-100 rounded-lg transition-all">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
      <span class="material-symbols-outlined text-[#0ea37a]">{{ isEdit ? 'edit_note' : 'note_add' }}</span>
      {{ isEdit ? 'Modifier la Réclamation' : 'Nouvelle Réclamation' }}
    </h1>
  </div>

  <!-- Success message -->
  <div *ngIf="successMessage"
    class="flex items-center gap-2 p-4 bg-green-50 border border-green-200 rounded-lg text-green-700">
    <span class="material-symbols-outlined">check_circle</span>
    {{ successMessage }}
  </div>

  <!-- Error message -->
  <div *ngIf="errorMessage"
    class="flex items-center gap-2 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
    <span class="material-symbols-outlined">error</span>
    {{ errorMessage }}
  </div>

  <!-- Form card -->
  <form [formGroup]="complaintForm" (ngSubmit)="onSubmit()" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 space-y-5">

    <!-- Title -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        <span class="material-symbols-outlined text-sm align-middle mr-1">title</span>
        Titre *
      </label>
      <input formControlName="title" type="text" placeholder="Titre de la réclamation"
        class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-[#0ea37a]/30 focus:border-[#0ea37a] outline-none transition-all"
        [ngClass]="complaintForm.get('title')?.invalid && complaintForm.get('title')?.touched ? 'border-red-400' : 'border-gray-200'" />
      <p *ngIf="complaintForm.get('title')?.invalid && complaintForm.get('title')?.touched"
        class="mt-1 text-sm text-red-500 flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">error</span>
        Le titre est requis (minimum 3 caractères)
      </p>
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        <span class="material-symbols-outlined text-sm align-middle mr-1">description</span>
        Description *
      </label>
      <textarea formControlName="description" rows="5" placeholder="Décrivez votre réclamation en détail..."
        class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-[#0ea37a]/30 focus:border-[#0ea37a] outline-none transition-all resize-none"
        [ngClass]="complaintForm.get('description')?.invalid && complaintForm.get('description')?.touched ? 'border-red-400' : 'border-gray-200'"></textarea>
      <p *ngIf="complaintForm.get('description')?.invalid && complaintForm.get('description')?.touched"
        class="mt-1 text-sm text-red-500 flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">error</span>
        La description est requise (minimum 10 caractères)
      </p>
    </div>

    <!-- Status (only in edit mode) -->
    <div *ngIf="isEdit">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        <span class="material-symbols-outlined text-sm align-middle mr-1">flag</span>
        Statut
      </label>
      <select formControlName="status"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0ea37a]/30 focus:border-[#0ea37a] outline-none transition-all bg-white">
        <option *ngFor="let s of statuses" [value]="s">{{ getStatusLabel(s) }}</option>
      </select>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
      <button type="submit" [disabled]="submitting"
        class="flex items-center gap-2 px-6 py-2.5 bg-[#0ea37a] text-white rounded-lg hover:bg-[#0b8a68] transition-all disabled:opacity-50 disabled:cursor-not-allowed font-medium">
        <span *ngIf="submitting" class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
        <span *ngIf="!submitting" class="material-symbols-outlined text-xl">{{ isEdit ? 'save' : 'add_circle' }}</span>
        {{ submitting ? 'En cours...' : (isEdit ? 'Enregistrer' : 'Créer') }}
      </button>
      <button type="button" (click)="cancel()"
        class="flex items-center gap-2 px-6 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-all font-medium">
        <span class="material-symbols-outlined text-xl">close</span>
        Annuler
      </button>
    </div>
  </form>
</div>
