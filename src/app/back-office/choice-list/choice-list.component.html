<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button (click)="goBack()" class="p-2 hover:bg-gray-100 rounded-lg transition-all">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h1 class="text-2xl font-bold text-gray-800">Choices for Question #{{ questionId }}</h1>
    </div>
    <button (click)="addChoice()"
      class="flex items-center gap-2 px-4 py-2 bg-[#0ea37a] text-white rounded-lg hover:bg-[#0b8a68] transition-all">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Choice
    </button>
  </div>

  <!-- Empty state -->
  <div *ngIf="choices.length === 0" class="text-center py-16 text-gray-400">
    <p class="text-lg">No choices for this question</p>
  </div>

  <!-- Choices list -->
  <div class="space-y-3">
    <div *ngFor="let choice of choices"
      class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 hover:shadow-md transition-shadow flex items-center justify-between"
      [ngClass]="{ 'border-l-4 border-l-green-500': choice.isCorrect }">
      <div class="flex items-center gap-3">
        <span *ngIf="choice.isCorrect"
          class="flex items-center justify-center w-6 h-6 bg-green-100 text-green-600 rounded-full">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        <span *ngIf="!choice.isCorrect"
          class="flex items-center justify-center w-6 h-6 bg-gray-100 text-gray-400 rounded-full">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </span>
        <span class="text-gray-800">{{ choice.content }}</span>
      </div>
      <div class="flex items-center gap-1">
        <button (click)="editChoice(choice.id!)"
          class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
        <button (click)="deleteChoice(choice.id!)"
          class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
